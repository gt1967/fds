<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<title>FdS Adesso Vicino</title>
<meta name="theme-color" content="#0d6c74">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app a colonna singola per telefono; barra con due viste (Adesso, Mappa); preferenze richiudibili; elenco ordinato per minuti a piedi */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#14212b; --muted:#5b6a75; --line:#d6dde2; --soft:#e8eef1;
  --accent:#0d6c74; --accent-ink:#ffffff; --c-conf:#2563c9; --c-lab:#e07418; --c-mostra:#7c4dcc; --c-spett:#c2348a; --c-spec:#a68a00; --c-other:#8a97a0; --ok:#1f7a3d; --warn:#a36200; --late:#b3261e; --pin:#d01f4f; --me:#1b5fd1;
  --f-display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1519; --panel:#152026; --ink:#e6edf1; --muted:#97a6b0; --line:#26343c; --soft:#1b2a31;
  --accent:#4fb9c1; --accent-ink:#06191b; --c-conf:#6ea0ff; --c-lab:#ff9b4a; --c-mostra:#b08cff; --c-spett:#f07cc0; --c-spec:#e3c63a; --c-other:#97a6b0; --ok:#5fc983; --warn:#e3a740; --late:#f0857c; --pin:#ff5b86; --me:#6ea4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1519; --panel:#152026; --ink:#e6edf1; --muted:#97a6b0; --line:#26343c; --soft:#1b2a31;
  --accent:#4fb9c1; --accent-ink:#06191b; --c-conf:#6ea0ff; --c-lab:#ff9b4a; --c-mostra:#b08cff; --c-spett:#f07cc0; --c-spec:#e3c63a; --c-other:#97a6b0; --ok:#5fc983; --warn:#e3a740; --late:#f0857c; --pin:#ff5b86; --me:#6ea4ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header h1{font-family:var(--f-display);font-weight:700;font-size:1.65rem;margin:0;line-height:1.1;text-wrap:balance}
header p{margin:3px 0 0;color:var(--muted);font-size:.86rem}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.big{appearance:none;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--f-display);font-weight:700;font-size:1.3rem;padding:15px;width:100%;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
select,input[type=search]{font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;text-transform:none;letter-spacing:0}
.full{grid-column:1/-1}
details.prefs{background:var(--panel);border:1px solid var(--line);border-radius:12px}
details.prefs summary{cursor:pointer;padding:11px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.prefs summary::after{content:"Modifica";color:var(--accent);font-weight:600;font-size:.88rem}
details.prefs[open] summary::after{content:"Chiudi"}
details.prefs summary span{color:var(--muted);font-weight:400;font-size:.88rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prefbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:.86rem;color:var(--muted)}
.status b{color:var(--ink)}
.board{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.ev > button.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;width:100%;cursor:pointer}
.ev > button.head:focus-visible{outline:3px solid var(--warn);outline-offset:-3px;border-radius:12px}
.t{font-family:var(--f-mono);font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums;line-height:1.2;min-width:3.4em}
.t small{display:block;font-weight:500;font-size:.7rem;color:var(--muted)}
.body{min-width:0}
.ev h3{font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:.9rem;margin-top:1px}
.where{font-size:.9rem;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pill{font-size:.74rem;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.late{color:var(--late);border-color:currentColor}
.walk{font-family:var(--f-mono);font-size:.8rem}
.more{padding:0 12px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.more p{margin:8px 0 0;white-space:pre-line;font-size:.95rem;max-width:65ch}
.more img{border-radius:8px;margin-top:10px;max-height:220px;object-fit:cover;width:100%}
.kv{font-size:.88rem;color:var(--muted)} .kv b{color:var(--ink);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{font:inherit;font-size:.9rem;font-weight:600;color:var(--accent);background:var(--soft);border:0;border-radius:8px;padding:7px 10px;text-decoration:none;cursor:pointer}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.mapbox{position:relative;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--soft);max-height:70vh;touch-action:pan-x pan-y pinch-zoom}
.mapinner{position:relative;width:calc(1000px * var(--z,0.5));}
.mapinner svg{display:block;width:100%;height:auto}
.vlab{font:600 13px var(--f-body);fill:var(--ink)}
.vnum{font:700 12px var(--f-mono);fill:var(--panel)}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.dot.sm{background:var(--pin);width:14px;height:14px;margin:-7px 0 0 -7px;border-width:2px;cursor:pointer}
.quick{padding:0 12px 10px 12px;display:flex;gap:8px}
.quick button{font:inherit;font-size:.86rem;font-weight:600;color:var(--accent);background:var(--soft);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.dot.me{background:var(--me)} .dot.ev{background:var(--pin);width:22px;height:22px;margin:-11px 0 0 -11px}
.zoom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zoom button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
#lmap{height:68vh;min-height:320px;border:1px solid var(--line);border-radius:12px;z-index:0}
.leaflet-popup-content{font-family:var(--f-body);font-size:14px;line-height:1.35;margin:10px 12px}
.pop{color:#14212b}
.pop small{color:#5b6a75}
.pop h4{font-family:var(--f-display);font-size:1.02rem;margin:0 0 6px}
.pop ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.pop li{display:flex;gap:8px;align-items:baseline}
.pop .tm{font-family:var(--f-mono);font-weight:700;min-width:3.8em}
.pop button{all:unset;cursor:pointer;color:#0d6c74;font-weight:600;text-decoration:underline}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.92rem;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.quick button.fav[aria-pressed="true"]{color:var(--pin)}
.quick button.go[aria-pressed="true"]{background:var(--ok);color:var(--panel)}
.ev.isgo{border-color:var(--ok);border-top-color:var(--tc,var(--ok));box-shadow:inset 4px 0 0 var(--ok)}
.whenrow{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);text-transform:none;letter-spacing:0;grid-column:1/-1}
.whenrow input{width:18px;height:18px;margin:0}
.photo{margin-top:10px}
.photo img{border-radius:8px;width:100%;max-height:240px;object-fit:cover;display:block}
.photo small{color:var(--muted);font-size:.74rem}
.desc:empty{display:none}
.srcnote{font-size:.76rem;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.srcnote a{color:var(--accent);font-weight:600}
.desc{margin:8px 0 0;white-space:pre-line;font-size:.95rem;max-width:65ch}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.zone > h3{font-family:var(--f-display);font-size:1.15rem;margin:0;padding:10px 12px 2px}
.zone > .zsub{color:var(--muted);font-size:.84rem;padding:0 12px 8px}
.zrow{border-top:1px solid var(--line)}
.zrow .zh{all:unset;box-sizing:border-box;display:grid;grid-template-columns:7.2em 1fr;gap:2px 10px;padding:8px 12px;width:100%;cursor:pointer}
.zrow .zh:focus-visible{outline:3px solid var(--warn);outline-offset:-3px}
.zt{font-family:var(--f-mono);font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.zt small{display:block;font-weight:500;color:var(--muted)}
.zrow b{font-family:var(--f-display);font-size:1.02rem}
.zrow .zs{color:var(--muted);font-size:.85rem}
.zrow.isgo{box-shadow:inset 4px 0 0 var(--ok)}
.zrow .quick{padding:0 12px 8px 12px;flex-wrap:wrap}
.quick button{white-space:nowrap}
.zones{display:flex;flex-direction:column;gap:10px}
.plan{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.plan h3{font-family:var(--f-display);margin:0;font-size:1.2rem}
.plan table{width:100%;border-collapse:collapse;font-size:.9rem}
.plan td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.plan td:first-child{font-family:var(--f-mono);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
.plan tr.walkrow td{color:var(--muted);font-size:.84rem}
.plan tr.meal td{color:var(--muted);font-style:italic}
.plan .warn{color:var(--warn)} .plan .note{font-size:.84rem;color:var(--muted)}
.t-conf{--tc:var(--c-conf)} .t-lab{--tc:var(--c-lab)} .t-mostra{--tc:var(--c-mostra)} .t-spett{--tc:var(--c-spett)} .t-spec{--tc:var(--c-spec)} .t-other{--tc:var(--c-other)}
.ev{border-top:5px solid var(--tc,var(--line))}
.zrow{border-top:4px solid var(--tc,var(--line))}
.pill.type{color:var(--ink);border-color:var(--tc)}
.pill.type::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--tc);margin-right:5px;vertical-align:1px}
.typelegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}
.typelegend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--tc);margin-right:5px;vertical-align:2px}
.plan tr.t-conf td:first-child,.plan tr.t-lab td:first-child,.plan tr.t-mostra td:first-child,.plan tr.t-spett td:first-child,.plan tr.t-spec td:first-child{box-shadow:inset 4px 0 0 var(--tc);padding-left:9px}
.sharebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sharebar button,.importbox button{font:inherit;font-size:.9rem;font-weight:600;color:var(--accent);background:var(--soft);border:0;border-radius:8px;padding:7px 11px;cursor:pointer}
.sharebar input{font:inherit;font-size:.85rem;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.importbox{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.importbox h3{margin:0;font-family:var(--f-display);font-size:1.15rem}
.importbox ul{margin:0;padding-left:18px;font-size:.9rem;max-height:30vh;overflow:auto}
.importbox .row{display:flex;flex-wrap:wrap;gap:8px}
.importbox button.primary{background:var(--accent);color:var(--accent-ink)}
.planbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.planbtns .big{font-size:1.05rem;padding:13px 8px}
.big.alt{background:var(--ok)}
.findbar input{font:inherit;font-size:1rem;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
.findres{display:flex;flex-direction:column;gap:0;background:var(--panel);border:1px solid var(--accent);border-radius:12px;overflow:hidden}
.findres .fhead{padding:8px 12px;font-size:.86rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.findres .fhead button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.legend{columns:2;column-gap:16px;font-size:.84rem;padding:0;margin:0;list-style:none}
.legend li{break-inside:avoid;padding:2px 0} .legend b{font-family:var(--f-mono);display:inline-block;min-width:2.2em;color:var(--pin)}
footer{font-size:.78rem;color:var(--muted)}
@media (max-width:420px){.legend{columns:1}}
@media (max-width:360px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Cosa c'è vicino, adesso</h1>
    <p>FdS 2026 · Genova · 22 ottobre – 1 novembre</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-now" aria-selected="true" type="button">Adesso</button>
    <button role="tab" id="tab-day" aria-selected="false" type="button">Programma</button>
    <button role="tab" id="tab-map" aria-selected="false" type="button">Mappa</button>
  </div>
  <div class="seg" role="group" aria-label="Quali eventi mostrare" id="show">
    <button type="button" data-show="all">Tutti</button>
    <button type="button" data-show="fav">❤️ Preferiti <span id="nfav"></span></button>
    <button type="button" data-show="go">✓ Partecipo <span id="ngo"></span></button>
  </div>
  <div class="typelegend" aria-label="Colori per tipo di evento"><span class="t-conf">Conferenza</span><span class="t-lab">Laboratorio</span><span class="t-mostra">Mostra</span><span class="t-spett">Spettacolo</span><span class="t-spec">Evento speciale</span></div>
  <div class="sharebar"><button type="button" id="share">🔗 Condividi i miei eventi</button><span class="status" id="sharemsg" aria-live="polite"></span></div>
  <div class="importbox" id="importbox" hidden></div>
  <div class="findbar"><input type="search" id="find" placeholder="🔎 Cerca un evento per nome, tema o relatore" autocomplete="off" aria-label="Cerca un evento"></div>
  <div class="findres" id="findres" hidden></div>

  <section id="view-now" style="display:flex;flex-direction:column;gap:12px">
    <button class="big" id="go" type="button">Cosa c'è nei prossimi minuti?</button>

    <div class="controls">
      <label class="lbl full">Dove sono <select id="where"></select></label>
      <label class="lbl">Nei prossimi
        <select id="win"><option value="15">15 minuti</option><option value="30" selected>30 minuti</option><option value="45">45 minuti</option><option value="60">60 minuti</option><option value="90">90 minuti</option><option value="120">2 ore</option></select>
      </label>
      <label class="lbl">Quando <select id="when"></select></label>
      <label class="whenrow"><input type="checkbox" id="past"> Mostra anche giorni e orari già passati</label>
    </div>

    <details class="prefs" id="prefs">
      <summary>Interessi ed età <span id="prefsum"></span></summary>
      <div class="prefbody">
        <label class="lbl">Età di chi partecipa
          <select id="age">
            <option value="">Qualsiasi</option><option value="4-5">4-5 anni</option><option value="6-7">6-7 anni</option><option value="8-10">8-10 anni</option>
            <option value="11-13">11-13 anni</option><option value="14-15">14-15 anni</option><option value="16-19">16-19 anni</option><option value="20+">Adulti (20+)</option>
          </select>
        </label>
        <div class="lbl">Interessi (nessuno scelto = tutti)<div class="chips" id="disc"></div></div>
        <div class="lbl">Tipo di evento<div class="chips" id="types"></div></div>
        <label class="lbl">Cerca parola (titolo, temi, relatori) <input type="search" id="q" placeholder="es. intelligenza artificiale, quanti, Pievani"></label>
      </div>
    </details>

    <div class="status" id="status" aria-live="polite"></div>
    <ul class="board" id="board"></ul>
  </section>

  <section id="view-day" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="controls">
      <label class="lbl">Giorno <select id="day"></select></label>
      <label class="lbl">Parto da <select id="dayfrom"></select></label>
    </div>
    <div class="planbtns"><button class="big" id="plan" type="button">🧭 Percorso dai ❤️ preferiti</button><button class="big alt" id="plan-mine" type="button">✓ Il mio programma</button></div>
    <div id="planout"></div>
    <div class="status" id="daystatus"></div>
    <div id="zones" class="zones"></div>
  </section>

  <section id="view-map" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="status" id="mapcap">Blu: tu. Rosa: le sedi con eventi nei prossimi minuti. Tocca un pallino per vedere gli eventi.</div>
    <div id="lmap" role="region" aria-label="Mappa delle sedi con gli eventi in partenza"></div>
  </section>

// ---------- calcolo ----------
function refTime(){
  if (whenSel.value === "now"){ const n = romeNow(); return {dd:n.dd, min:n.min, now:true}; }
  const [dd,m] = whenSel.value.split("|"); return {dd, min:+m, now:false};
}
function matches(e){
  if (!st.types.includes(e.g) && TYPES.includes(e.g)) return false;
  if (st.disc.length && !st.disc.includes(e.d)) return false;
  if (st.age && e.tg && !e.tg.split(",").includes(st.age)) return false;
  if (st.q){ const hay = (e.t+" "+e.s+" "+e.k.join(" ")+" "+e.r+" "+e.d).toLowerCase(); if (!st.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false; }
  return true;
}
function upcoming(dd, now, win){
  const lim = now + win, out = [];
  for (const e of EVENTS){
    const ranges = e.S[dd]; if (!ranges || !matches(e)) continue;
    for (const [a,b] of ranges){
      const longSpecial = e.g==="Evento speciale" && (b-a) > 150;
      if (START_TYPES.has(e.g) || (e.g==="Evento speciale" && !longSpecial)){
        if (a >= now-3 && a <= lim){ out.push({e, kind:"start", start:a, end:b}); break; }
      } else if (e.tu){
        const [every, dur] = e.tu; let s = a; while (s < now-3) s += every;
        if (s <= lim && s + dur <= b + 10){ out.push({e, kind:"slot", start:s, end:s+dur, every}); break; }
      } else {
        if (now < b && a <= lim){ out.push({e, kind:"open", start:Math.max(a,now), opens:a, end:b}); break; }
      }
    }
  }
  return out;
}

function card(x, rt){
  const e = x.e, id = e.id, isOpen = st.open === id;
  let reach = "";
  if (x.kind==="open") reach = x.opens > rt.min ? `<span class="pill">apre alle ${hm(x.opens)}</span>` : `<span class="pill ok">aperto fino alle ${hm(x.end)}</span>`;
  else if (x.w != null){
    const slack = x.start - rt.min - x.w;
    reach = slack >= 5 ? `<span class="pill ok">arrivi con ${slack}' di margine</span>` : slack >= 0 ? `<span class="pill warn">giusto in tempo</span>` : `<span class="pill late">in ritardo di ${-slack}'</span>`;
  }
  const dist = x.dist==null ? "" : x.dist < 1000 ? Math.round(x.dist/10)*10+" m" : (x.dist/1000).toFixed(1).replace(".",",")+" km";
  const tlabel = x.kind==="open" ? (x.opens > rt.min ? hm(x.opens) : "ora") : hm(x.start);
  const tsub = x.kind==="open" ? "libero" : x.kind==="slot" ? `turno ${x.every}'` : "→ "+hm(x.end);
  const age = e.tg ? e.tg.replace("20+","adulti").split(",").join(" · ") : "";
  const more = isOpen ? moreBlock(e) : "";
  return `<li class="ev ${tcls(e.g)}${st.go[id]?" isgo":""}"><button type="button" class="head" data-id="${id}" aria-expanded="${isOpen}">
    <div class="t">${tlabel}<small>${tsub}</small></div>
    <div class="body"><h3>${esc(e.t)}</h3>${e.s?`<div class="sub">${esc(e.s)}</div>`:""}
      <div class="where">${esc(e.l)}</div>
      <div class="meta">${x.w!=null?`<span class="walk">🚶 ${x.w}' · ${dist}</span>`:`<span class="pill">sede senza coordinate</span>`}${reach}
        <span class="pill type">${esc(e.g)}</span>${e.d?`<span class="pill">${esc(e.d)}</span>`:""}${age?`<span class="pill">${esc(age)}</span>`:""}</div>
    </div></button><div class="quick">
      <button type="button" class="fav" data-fav="${id}" aria-pressed="${st.fav.has(id)}" aria-label="Preferito">${st.fav.has(id)?"❤️":"🤍"}</button>
      <button type="button" class="go" data-go="${id}" data-dd="${rt.dd}" data-start="${x.kind==="open"?"":x.start}" aria-pressed="${!!st.go[id]}">${st.go[id]?"✓ Partecipo":"＋ Partecipo"}</button>
      ${e.la!=null?`<button type="button" data-map="${id}">📍 Mappa</button>`:""}
      ${isOpen?"":`<button type="button" data-id-open="${id}">Dettagli</button>`}
    </div>${more}</li>`;
}

const DESC = new Map(); const DESC_TRIED = new Set();
async function loadDesc(id){
  if (DESC.has(id) || DESC_TRIED.has(id)) return; DESC_TRIED.add(id);
  const e = EVENTS.find(x=>x.id===id); if (!e || !e.slug) return;
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 5000);
    const r = await fetch(LIVE_ROOT+"events/"+e.slug+".json", {signal:ctl.signal}); if (!r.ok) return;
    const x = await r.json(); const tmp = document.createElement("div"); tmp.innerHTML = x.descrizione || x.abstract || "";
    const t = (tmp.textContent||"").replace(/\u00a0/g," ").replace(/([^\n])\n(?!\n)/g,"$1 ").replace(/[ \t]+/g," ").trim();
    if (t){ DESC.set(id, t); const p = document.getElementById("desc-"+id); if (p){ p.textContent = t; const n = p.nextElementSibling; if (n && n.classList.contains("srcnote")) n.firstChild.textContent = "Descrizione pubblicata sul sito ufficiale del Festival della Scienza"; } }
  }catch(err){}
}

function locate(){
  if (whereSel.value !== "__gps"){ setVenue(whereSel.value); render(); return; }
  $("#status").textContent = "Cerco la posizione…";
  let done = false;
  const fail = msg => { if (done) return; done = true; whereSel.value = st.where || "Palazzo Ducale"; setVenue(whereSel.value); render();
    $("#status").insertAdjacentHTML("afterbegin", `${esc(msg)} Scegli la sede più vicina in "Dove sono". `); };
  if (!("geolocation" in navigator)) return fail("Il GPS non è disponibile.");
  setTimeout(()=>fail("Il GPS non risponde."), 9000);
  try{
    navigator.geolocation.getCurrentPosition(pos => { if (done) return; done = true;
      st.here = {p:[pos.coords.latitude,pos.coords.longitude], label:"la tua posizione"}; render(); },
      () => fail("Posizione non concessa."), {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
  }catch(e){ fail("Il GPS non è disponibile."); }
}

let lmap = null, layer = null;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawMap(){
  if (!window.L){ $("#mapcap").textContent = "La mappa ha bisogno della connessione internet. Usa \"Portami lì\" negli eventi."; return; }
  if (!lmap){
    lmap = L.map("lmap", {zoomControl:true}).setView([44.4095, 8.9300], 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(lmap);
    layer = L.layerGroup().addTo(lmap);
  }
  setTimeout(()=>lmap.invalidateSize(), 50);
  layer.clearLayers();
  const pin = cssVar("--pin") || "#d01f4f", me = cssVar("--me") || "#1b5fd1";
  const fe = st.focus ? EVENTS.find(e=>e.id===st.focus) : null;
  const groups = new Map();
  for (const x of (st.list||[])){ const e = x.e; if (e.la==null) continue;
    const k = e.l.split(",")[0].trim(); if (!groups.has(k)) groups.set(k, {p:[e.la,e.lo], name:k, items:[]});
    groups.get(k).items.push(x); }
  if (fe && fe.la!=null){ const k = fe.l.split(",")[0].trim(); if (!groups.has(k)) groups.set(k, {p:[fe.la,fe.lo], name:fe.l.split(",")[0].trim(), items:[{e:fe, kind:"focus"}]}); }
  const pts = []; let focusMarker = null;
  for (const [k,g] of groups){
    const isF = fe && g.items.some(x=>x.e.id===fe.id);
    const html = `<div class="pop"><h4>${esc(g.name)}</h4><ul>` + g.items.sort((a,b)=>(a.start??0)-(b.start??0)).map(x=>
      `<li><span class="tm">${x.kind==="open"?"libero":x.kind==="focus"?"":hm(x.start)}</span><span>${esc(x.e.t)}${x.e.l.includes(",")?` <small>(${esc(x.e.l.split(",").slice(1).join(",").trim())})</small>`:""} · <button type="button" data-open="${x.e.id}">dettagli</button></span></li>`).join("") + `</ul></div>`;
    const m = L.circleMarker(g.p, {radius: isF?13:9, color:"#fff", weight:3, fillColor:pin, fillOpacity: isF?1:.85}).bindPopup(html, {maxWidth:280});
    layer.addLayer(m); pts.push(g.p);
    if (isF) focusMarker = m;
  }
  if (st.here){ const m = L.circleMarker(st.here.p, {radius:9, color:"#fff", weight:3, fillColor:me, fillOpacity:1}).bindPopup("<b>Tu</b>: "+esc(st.here.label));
    layer.addLayer(m); pts.push(st.here.p); }
  $("#mapcap").textContent = fe ? `Evento scelto: ${fe.t} (pallino grande). Blu: tu. Gli altri pallini rosa sono le sedi con eventi nei prossimi minuti: toccali.`
    : `Blu: tu. Rosa: ${groups.size} sedi con eventi nei prossimi minuti (con i tuoi filtri). Tocca un pallino per vedere quali.`;
  setTimeout(()=>{
    if (focusMarker){ lmap.setView(focusMarker.getLatLng(), 17); focusMarker.openPopup(); }
    else if (st.here) lmap.setView(st.here.p, 16);
    else if (pts.length) lmap.setView(pts[0], 16);
  }, 80);
}

// ---------- programma del giorno ----------
const vname = e => e.l.split(",")[0].trim();
const room = e => e.l.includes(",") ? e.l.split(",").slice(1).join(",").trim() : "";
const isStart = (e,a,b) => START_TYPES.has(e.g) || (e.g==="Evento speciale" && (b-a) <= 150);
// zone: le sedi con più eventi fanno da centro; le altre entro 300 m si uniscono alla più vicina
const ZONES = (() => {
  const cnt = new Map(); for (const e of EVENTS) cnt.set(vname(e), (cnt.get(vname(e))||0)+1);
  const vs = [...VENUES].sort((a,b)=>(cnt.get(b.n)||0)-(cnt.get(a.n)||0));
  const list = [], byVenue = new Map();
  for (const v of vs){
    let best = null, bd = 1e9;
    for (const z of list){ const d = hav(v.p, z.p); if (d < 300 && d < bd){ best = z; bd = d; } }
    if (best){ best.venues.push(v.n); byVenue.set(v.n, best); }
    else { const z = {name:v.n, venues:[v.n], p:v.p}; list.push(z); byVenue.set(v.n, z); }
  }
  for (const z of list) if (z.venues.length > 1) z.name = "Zona " + z.name;
  return {list, byVenue};
})();
// ---------- ricerca per nome (tutti i giorni) ----------
const normTxt = x => String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"'");
function nextSession(e){
  const n = romeNow(), inFest = DAYS.includes(n.dd);
  for (const dd of DAYS){
    if (inFest && dayIdx(dd) < dayIdx(n.dd)) continue;
    const r = e.S[dd]; if (!r) continue;
    const ok = r.filter(([a,b]) => !(inFest && dd===n.dd && b <= n.min)); if (!ok.length) continue;
    return {dd, a:ok[0][0], b:ok[0][1], start: isStart(e, ok[0][0], ok[0][1]) ? ok[0][0] : null};
  }
  for (const dd of DAYS){ const r = e.S[dd]; if (r) return {dd, a:r[0][0], b:r[0][1], start: isStart(e,r[0][0],r[0][1]) ? r[0][0] : null, past:true}; }
  return null;
}
function whenText(e){
  const days = DAYS.filter(dd=>e.S[dd]);
  if (!days.length) return "";
  const first = days[0], last = days[days.length-1];
  const ns = nextSession(e);
  const span = days.length === 1 ? dayLabel(first) : `${dayLabel(first)} – ${dayLabel(last)} (${days.length} giorni)`;
  const nxt = ns ? `${ns.past ? "ultimo" : "prossimo"}: ${dayLabel(ns.dd)} ${ns.start!=null ? hm(ns.start) : hm(ns.a)+"–"+hm(ns.b)}` : "";
  return span + (nxt ? " · " + nxt : "");
}
function renderFind(){
  const q = normTxt($("#find").value.trim()), box = $("#findres");
  if (q.length < 2){ box.hidden = true; box.innerHTML = ""; return; }
  const words = q.split(/\s+/);
  const scored = [];
  for (const e of EVENTS){
    const title = normTxt(e.t), hay = normTxt(e.t+" "+e.s+" "+e.k.join(" ")+" "+e.r+" "+e.l);
    if (!words.every(w => hay.includes(w))) continue;
    scored.push({e, sc: (title.startsWith(q) ? 0 : title.includes(q) ? 1 : words.every(w=>title.includes(w)) ? 2 : 3)});
  }
  scored.sort((a,b)=>a.sc-b.sc || a.e.t.localeCompare(b.e.t,"it"));
  const top = scored.slice(0, 30);
  box.hidden = false;
  box.innerHTML = `<div class="fhead"><span>${scored.length} ${scored.length===1?"evento trovato":"eventi trovati"}${scored.length>30?" (primi 30)":""}</span><button type="button" id="findclose">Chiudi</button></div>` +
    (top.length ? top.map(({e}) => { const ns = nextSession(e), open = st.open===e.id;

// ---------- percorso automatico ----------
const LAB_DEF = 40, CONF_DEF = 50, MOSTRA_DEF = 30;
function walkBetween(a, b){ if (!a || !b) return 0; const d = hav(a, b); return d < 80 ? 0 : walkMin(d); }
function makePlan(dd, from, mode){
  const mine = mode === "go";
  const n = romeNow();
  let t = (!mine && dd===n.dd && n.min > toMin("10:00")) ? Math.ceil(n.min/5)*5 : toMin("10:00");
  const pool = mine ? EVENTS.filter(e => e.S[dd] && st.go[e.id] && st.go[e.id].dd === dd) : EVENTS.filter(e => e.S[dd] && st.fav.has(e.id));
  const fixed = [], flex = [], nopos = [];
  const durAt = (e, s) => { for (const [a,b] of e.S[dd]) if (a===s && isStart(e,a,b)) return b>a && b-a<=180 ? b-a : CONF_DEF;
    return e.tu ? e.tu[1] : (e.g==="Mostra" ? MOSTRA_DEF : START_TYPES.has(e.g) ? CONF_DEF : LAB_DEF); };
  if (mine){
    for (const e of pool){
      if (e.la==null){ nopos.push(e); continue; }
      const g = st.go[e.id];
      if (g.start != null) fixed.push({e, start:g.start, end:g.start + durAt(e, g.start)}); else flex.push({e, ranges:e.S[dd]});
    }
    if (fixed.length) t = Math.min(t, fixed.reduce((m,f)=>Math.min(m,f.start), 1e9));
  }
  for (const e of (mine ? [] : pool)){
    for (const [a,b] of e.S[dd]){
      if (isStart(e,a,b) && e.la!=null){ const dur = b>a && b-a<=180 ? b-a : CONF_DEF; fixed.push({e, start:a, end:a+dur}); }
    }
    if (e.la==null){ nopos.push(e); continue; }
    if (!e.S[dd].some(([a,b])=>isStart(e,a,b))) flex.push({e, ranges:e.S[dd]});
  }
  // tra più orari dello stesso evento fisso, tieni il primo raggiungibile
  fixed.sort((x,y)=>x.start-y.start);
  const fixedU = mine ? fixed : fixed.filter(f => f.start >= t);
  const rows = [], skipped = [], done = new Set();
  let pos = from.p, posName = from.n, lunch = false, dinner = false;
  const P = e => e.la!=null ? [e.la, e.lo] : pos;
  const flexSlot = (it, after) => { // primo inizio possibile ≥ after
    const e = it.e, dur = e.tu ? e.tu[1] : (e.g==="Mostra" ? MOSTRA_DEF : LAB_DEF);
    for (const [a,b] of it.ranges){
      if (e.tu){ let s = a; while (s < Math.max(after - 3, t)) s += e.tu[0]; if (s + dur <= b + 5) return {start:s, end:s+dur}; }
      else { const s = Math.max(a, after, t); if (s + dur <= b) return {start:s, end:s+dur}; }
    }
    return null;
  };
  const push = (start, end, e, extra) => { rows.push({start, end, e, ...extra}); };
  const moveTo = (p, name) => { const w = walkBetween(pos, p); if (w >= 4 && name !== posName) rows.push({start:t, end:t+w, walk:w, to:name}); t += w; pos = p; posName = name; };
  let fi = 0;
  for (let guard=0; guard<200; guard++){
    while (fixedU[fi] && done.has(fixedU[fi].e.id)) fi++;
    const next = fixedU[fi];
    // pasti
    const hasLate = fixedU.some(f=>f.start >= toMin("20:00")) || flex.some(it=>!done.has(it.e.id) && it.ranges.some(([a,b])=>b>=toMin("21:00")));
    if (!lunch && t >= toMin("12:00") && t <= toMin("14:30") && (!next || next.start - t >= 40)){ rows.push({start:t, end:t+40, meal:"Pranzo", where:posName}); t += 40; lunch = true; continue; }
    if (!dinner && hasLate && t >= toMin("19:00") && t <= toMin("20:30") && (!next || next.start - t >= 50)){ const d = next ? Math.min(90, next.start - t - walkBetween(pos, P(next.e)) - 5) : 60; rows.push({start:t, end:t+d, meal:"Cena", where:posName}); t += d; dinner = true; continue; }
    // laboratorio/mostra più comodo prima del prossimo evento fisso
    let best = null;
    for (const it of flex){
      if (done.has(it.e.id)) continue;
      const w = walkBetween(pos, P(it.e)), sl = flexSlot(it, t + w); if (!sl) continue;
      if (next && sl.end + walkBetween(P(it.e), P(next.e)) > next.start) continue;
      const wait = sl.start - t - w, cost = Math.max(0, wait) + 2.5*w + (next ? 0 : 0); // camminare pesa più che aspettare
      if (!best || cost < best.cost || (cost === best.cost && sl.start < best.sl.start)) best = {it, sl, cost, span: sl.start - t};
    }
    if (best && (!next || best.span < 60)){
      moveTo(P(best.it.e), vname(best.it.e)); if (best.sl.start - t >= 20) rows.push({free:true, start:t, end:best.sl.start}); t = Math.max(t, best.sl.start);
      push(best.sl.start, best.sl.end, best.it.e); t = best.sl.end; done.add(best.it.e.id); continue;
    }
    if (next){
      const w = walkBetween(pos, P(next.e));
      if (!mine && t + w > next.start + 5){ next.miss = true; fi++; continue; }
      const wn = walkBetween(pos, P(next.e));
      if (!dinner && next.start >= toMin("20:00") && t <= toMin("20:15")){
        const ds = Math.max(t, toMin("19:00")), de = Math.min(ds + 100, next.start - wn - 5);
        if (de - ds >= 40){ if (ds - t >= 20) rows.push({free:true, start:t, end:ds}); rows.push({start:ds, end:de, meal:"Cena", where:posName}); t = de; dinner = true; }
      }
      moveTo(P(next.e), vname(next.e)); if (next.start - t >= 20) rows.push({free:true, start:t, end:next.start});
      const late = t > next.start ? t - next.start : 0;
      push(next.start, next.end, next.e, {late, clash: mine && late >= (next.end - next.start)});
      t = Math.max(t, next.end); done.add(next.e.id); fi++; continue;
    }
    break;
  }
  for (const f of fixedU) if (!done.has(f.e.id) && !skipped.some(s=>s.e.id===f.e.id)) skipped.push({e:f.e, why: f.miss ? `non raggiungibile in tempo alle ${hm(f.start)}` : "sovrapposto ad altro"});
  for (const f of fixed) if (f.start < t && !done.has(f.e.id) && !skipped.some(s=>s.e.id===f.e.id)) skipped.push({e:f.e, why:"già iniziato"});
  for (const e of nopos) skipped.push({e, why:"sede non precisata"});
  for (const it of flex) if (!done.has(it.e.id)) skipped.push({e:it.e, why:"nessun turno libero compatibile"});
  for (const e of pool) if (!e.S[dd]) {}
  return {rows, skipped, from};
}
function renderPlan(mode){
  const mine = mode === "go";
  const dd = daySel.value, from = VENUES.find(v=>v.n===fromSel.value) || VENUES[0];
  const nsel = EVENTS.filter(e=>e.S[dd] && (mine ? (st.go[e.id] && st.go[e.id].dd===dd) : st.fav.has(e.id))).length;

      : `<div class="empty">Per creare il percorso metti il cuoricino 🤍 agli eventi che ti interessano in ${esc(dayLabel(dd))}: li trovi qui sotto o nella scheda Adesso.</div>`; return; }
  const P = makePlan(dd, from, mode);
  const ev = P.rows.filter(r=>r.e);
  const tr = P.rows.map(r => r.free ? `<tr class="walkrow"><td>${hm(r.start)}–${hm(r.end)}</td><td>Tempo libero (${r.end-r.start}')</td></tr>` : r.walk ? `<tr class="walkrow"><td>${hm(r.start)}</td><td>🚶 ${r.walk}' a piedi verso ${esc(r.to)}</td></tr>`
    : r.meal ? `<tr class="meal"><td>${hm(r.start)}–${hm(r.end)}</td><td>${r.meal} · zona ${esc(r.where)}</td></tr>`
    : `<tr class="${tcls(r.e.g)}"><td>${hm(r.start)}–${hm(r.end)}</td><td><b>${esc(r.e.t)}</b><br><span class="note">${esc(r.e.g)} · ${esc(r.e.l)}${r.clash?` · <span class="warn">⚠ sovrapposto all'evento precedente</span>`:r.late?` · <span class="warn">⚠ arrivi ${r.late}' dopo l'inizio</span>`:""}</span></td></tr>`).join("");
  const warns = P.rows.filter(r=>r.late||r.clash).length;
  $("#planout").innerHTML = `<div class="plan"><h3>${mine ? "Il mio programma" : "Percorso proposto"} · ${esc(dayLabel(dd))}</h3>
    ${mine ? `<div class="note">${warns ? `<span class="warn">⚠ ${warns} ${warns===1?"problema":"problemi"} di orario: controlla le righe segnate.</span>` : "Tutto raggiungibile a piedi negli orari scelti."}</div>` : ""}
    <div class="note">${ev.length} eventi · partenza da ${esc(from.n)} · durate stimate dove il programma non le indica (laboratori ${LAB_DEF}', mostre ${MOSTRA_DEF}', conferenze ${CONF_DEF}')</div>
    <table>${tr}</table>
    ${P.skipped.length ? `<div class="note"><b>Esclusi:</b> ${P.skipped.map(s=>`${esc(s.e.t)} (${esc(s.why)})`).join("; ")}</div>` : ""}
    <div class="links">${mine ? "" : `<button type="button" id="plan-go">✓ Segna questi eventi come Partecipo</button>`}<button type="button" id="plan-close">Chiudi</button></div></div>`;
  if (!mine) $("#plan-go").onclick = () => { for (const r of ev) st.go[r.e.id] = {dd, start:r.start}; saveGo(); renderPlan("go"); renderDay(); };
  $("#plan-close").onclick = () => { $("#planout").innerHTML = ""; };
}

function fixCoord(v, lat){
  const f = parseFloat(v); if (isNaN(f)) return null;
  if (lat) return f>43 && f<46 ? f : null;
  if (f>7 && f<11) return f;
  const s = String(v).split(".")[0].replace(/\D/g,""); if (!s) return null;
  const g = parseFloat("8."+(s[0]==="8"?s.slice(1):s)); return g>7 && g<11 ? g : null;
}
async function goLive(){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 5000);

    const first = await fetch(LIVE_ROOT+"api/search", {signal:ctl.signal}).then(r=>{ if(!r.ok) throw 0; return r.json(); });
    clearTimeout(t);
    const n = +first.nrows; let rows = [...first.rows];
    const froms = []; for (let f=rows.length; f<n; f+=12) froms.push(f);
    const pages = await Promise.all(froms.map(f=>fetch(LIVE_ROOT+"api/search?from="+f).then(r=>r.json()).then(j=>j.rows).catch(()=>[])));
    pages.forEach(p=>rows.push(...p));
    const byId = new Map(EVENTS.map(e=>[e.id,e]));
    for (const r of rows){
      const old = byId.get(r.id);
      if (old){ old.oc = r.orario_code || old.oc; old.or = r.orario || old.or; old.t = r.titolo || old.t; old.s = r.sottotitolo ?? old.s; old.S = parseOC(old.oc); continue; }
      try{
        const x = await fetch(LIVE_ROOT+"events/"+r.slug+".json").then(q=>q.json());
        const eo = x.eventi_organizzazione || {}, lu = typeof eo.luogo==="object" ? eo.luogo : {};
        const ne = {id:r.id, t:r.titolo, s:r.sottotitolo||"", g:x.genere||"", d:"", k:String(x.parole_chiave||"").split("#").map(p=>p.split("&")[0]).filter(Boolean),
          tg:x.target||"", bk:eo.booking||"", bi:eo.biglietto||"", oc:eo.orario_code||r.orario_code, or:eo.orario||r.orario, l:lu.descrizione||r.location,
          ind:lu.indirizzo||"", la:fixCoord(lu.latitudine,true), lo:fixCoord(lu.longitudine,false), m:null, tu:null, r:"", cu:"", slug:r.slug, desc:x.descrizione||"",
          im:(x.immagini&&x.immagini[0]&&x.immagini[0].url)||""};
        ne.S = parseOC(ne.oc); EVENTS.push(ne); byId.set(ne.id, ne);
      }catch(e){}
    }
    const live = new Set(rows.map(r=>r.id)); EVENTS = EVENTS.filter(e=>live.has(e.id));
    SOURCE = "dati in diretta dal sito ufficiale"; $("#src").textContent = "Fonte: "+SOURCE+". Tempi a piedi stimati: distanza in linea d'aria × 1,35 a 4,5 km/h.";
    render();
  }catch(e){ clearTimeout(t); }
}

// ---------- condivisione preferiti / partecipazioni via link ----------
// formato: #i=f<id>,<id>;g<id>-<DDMM>-<min>,...   (min vuoto = accesso libero)
function shareCode(){
  const f = [...st.fav].join(","), g = Object.entries(st.go).map(([id,v]) => `${id}-${v.dd}-${v.start ?? ""}`).join(",");
  return `f${f};g${g}`;
}
function parseCode(c){
  const out = {fav:[], go:{}}; const ids = new Set(EVENTS.map(e=>e.id));
  for (const part of String(c).split(";")){
    if (part[0]==="f") for (const id of part.slice(1).split(",")) if (ids.has(id)) out.fav.push(id);
    if (part[0]==="g") for (const it of part.slice(1).split(",")){ const [id,dd,m] = it.split("-"); if (ids.has(id) && /^\d{4}$/.test(dd)) out.go[id] = {dd, start: m==="" || m==null ? null : +m}; }
  }
  return out;
}

function checkImport(){
  const m = location.hash.match(/^#i=(.*)$/); if (!m) return;
  const data = parseCode(decodeURIComponent(m[1]));
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  const nf = data.fav.length, ng = Object.keys(data.go).length;
  const box = $("#importbox");
  if (!nf && !ng){ box.hidden = false; box.innerHTML = `<h3>Link non valido</h3><div>Il link non contiene eventi riconosciuti.</div><div class="row"><button type="button" data-imp="close">Chiudi</button></div>`; box.onclick = ev => { if (ev.target.closest("[data-imp]")){ box.hidden = true; box.innerHTML = ""; } }; return; }
  const name = id => (EVENTS.find(e=>e.id===id)||{}).t || id;
  const goList = Object.entries(data.go).map(([id,v]) => `<li>✓ ${esc(name(id))} · ${esc(dayLabel(v.dd))}${v.start!=null?" "+hm(v.start):""}</li>`).join("");
  const favList = data.fav.filter(id=>!data.go[id]).map(id => `<li>❤️ ${esc(name(id))}</li>`).join("");
  box.hidden = false;
  box.innerHTML = `<h3>Eventi ricevuti</h3><div>${nf} preferiti e ${ng} a cui partecipare.</div><ul>${goList}${favList}</ul>
    <div class="row"><button type="button" class="primary" data-imp="add">Aggiungi ai miei</button><button type="button" data-imp="replace">Sostituisci i miei</button><button type="button" data-imp="close">Annulla</button></div>`;
  box.onclick = ev => {
    const b = ev.target.closest("[data-imp]"); if (!b) return;
    if (b.dataset.imp === "replace"){ st.fav = new Set(); st.go = {}; }
    if (b.dataset.imp !== "close"){ data.fav.forEach(id=>st.fav.add(id)); Object.assign(st.go, data.go); saveFav(); saveGo();
      $("#sharemsg").textContent = b.dataset.imp==="replace" ? "Eventi sostituiti con quelli ricevuti." : "Eventi ricevuti aggiunti ai tuoi."; }
    box.hidden = true; box.innerHTML = ""; render(); if (TAB==="day") renderDay();
  };
}
window.addEventListener("hashchange", checkImport);

// ---------- avvio ----------
$("#src").textContent = "Dati: orari e sedi pubblicati dall'organizzazione dell'evento ("+SOURCE+"); turni dei laboratori dal programma stampato. Tempi a piedi stimati: distanza in linea d'aria × 1,35 a 4,5 km/h.";
setVenue(whereSel.value); render(); checkImport();
if (location.protocol.startsWith("http") && !/claude|anthropic|claudeusercontent/.test(location.hostname)) goLive();
</script>
